input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  if [level] == "ERROR" {
    mutate {
      add_tag => ["error"]
    }
  }

  if [level] == "WARN" {
    mutate {
      add_tag => ["warning"]
    }
  }

  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "insurance-logs-%{+YYYY.MM.dd}"
  }
  stdout {
    codec => rubydebug
  }
}